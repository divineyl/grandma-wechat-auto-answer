name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gkd-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Validate GKD json5
        run: python scripts/validate_gkd.py
