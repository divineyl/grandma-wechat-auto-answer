name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gkd-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Validate GKD json5
        run: python scripts/validate_gkd.py

  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check scripts
        run: |
          node --check autox/preflight.js
          node --check autox/auto-answer-fullscreen.js
          node --check autox/boot-start.js
          node --check autox/open-wechat-on-call.js
      - name: Test permission preflight
        run: node --test tests/preflight.test.js
      - name: Test preflight wiring
        run: python -m unittest tests.test_preflight_wiring -v
